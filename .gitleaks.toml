# Secret scanning config (https://github.com/gitleaks/gitleaks). Runs in CI on every push and PR.
title = "IBUVIO Pay gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "ibuvio-base64-key-assignment"
description = "Base64 key assigned to an IBUVIO secret variable"
regex = '''(?i)(JWT_SECRET|APP_ENCRYPTION_KEY|APP_HMAC_KEY|SMS_GATEWAY_API_KEY|DB_PASSWORD|FLYWAY_PASSWORD)\s*[=:]\s*['"]?[A-Za-z0-9+/=_-]{16,}'''

[allowlist]
description = "Example files only contain placeholders"
paths = ['''\.env\.example$''', '''design/.*\.png$''']
