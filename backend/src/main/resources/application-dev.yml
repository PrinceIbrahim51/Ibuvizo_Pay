# Local development only. Never deploy with this profile.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ibuvio}
    username: ${DB_USERNAME:ibuvio_app}
    password: ${DB_PASSWORD}
app:
  otp:
    sender: ${OTP_SENDER:log}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
